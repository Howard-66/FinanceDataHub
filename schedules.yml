      delay: 600

  hk_daily_update:
    enabled: true
    type: download
    dataset: daily
    resource_group: xtquant_helper
    schedule:
      type: cron
      hour: 19
      minute: 45
      day_of_week: "mon-fri"
    params:
      market: HK
      trade_date: "latest"
    retry:
      max_retries: 3
      delay: 300

  hk_adj_factor_update:
    enabled: true
    type: download
