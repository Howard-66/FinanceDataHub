      day_of_week: "mon-fri"
    params:
      asset_class: future
      start_date: "latest-1d"
      end_date: "latest+1d"
    depends_on: [futures_minute_5m_update]
    retry:
      max_retries: 3
      delay: 300

  futures_minute_30m_refresh:
    enabled: true
    type: aggregate
    dataset: futures.minute_30m
    schedule:
      type: cron
      hour: 17
      minute: 25
      day_of_week: "mon-fri"
    params:
