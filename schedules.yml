      delay: 300

  futures_minute_60m_refresh:
    enabled: true
    type: aggregate
    dataset: futures.minute_60m
    schedule:
      type: cron
      hour: 17
      minute: 30
      day_of_week: "mon-fri"
    params:
      asset_class: future
      start_date: "latest-1d"
      end_date: "latest+1d"
    depends_on: [futures_minute_5m_update]
    retry:
      max_retries: 3
      delay: 300

  futures_term_metrics_update:
    enabled: true
    type: download
    dataset: term_metrics
    schedule:
      type: cron
      hour: 16
      minute: 30
      day_of_week: "mon-fri"
    params:
