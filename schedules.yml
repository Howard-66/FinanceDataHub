    type: download
    dataset: daily
    schedule:
      type: cron
      hour: 18
      minute: 30
      day_of_week: "mon-fri"
    params:
      market: CN
      trade_date: "latest"
    retry:
      max_retries: 3
      delay: 300

  adj_factor_update:
