      delay: 600

  futures_monthly_saturday_update:
    enabled: true
    type: download
    dataset: monthly
    schedule:
      type: cron
      hour: 3
      minute: 18
      day_of_week: "sat"
    params:
      asset_class: future
      symbols: all
      end_date: "latest"
    depends_on: [futures_daily_saturday_update]
    retry:
      max_retries: 3
      delay: 600

  futures_minute_5m_saturday_update:
    enabled: false
    type: download
    dataset: minute_5
    resource_group: xtquant_helper
    catchup_on_failure: false
    schedule:
      type: cron
      hour: 3
      minute: 20
      day_of_week: "sat"
    params:
      asset_class: future
      symbols: all
      start_date: "latest"
      end_date: "latest+1d"
