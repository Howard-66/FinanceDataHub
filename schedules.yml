# FinanceDataHub 调度配置
# 
# 此文件定义了自动化数据下载和预处理任务的调度规则。
# 支持 cron、interval 两种调度类型。

scheduler:
  timezone: "Asia/Shanghai"
  job_store: "postgresql"         # 任务状态持久化到 PostgreSQL
  max_concurrent_jobs: 3          # 最大并发任务数
  misfire_grace_time: 300         # 错过执行的容忍时间（秒）

jobs:
  # ========== 数据下载任务 ==========
  
  # 日线数据 - 每日收盘后更新（17:00）
  daily_update:
    enabled: true
    type: download
    dataset: daily
    schedule:
      type: cron
      hour: 17
      minute: 0
      day_of_week: "mon-fri"
    params:
      market: CN
      trade_date: "latest"        # 自动获取最新交易日
    retry:
      max_retries: 3
      delay: 300

  # 港股日线数据 - 每日收盘后更新（17:05）
  hk_daily_update:
    enabled: true
    type: download
    dataset: daily
    schedule:
      type: cron
      hour: 17
      minute: 5
      day_of_week: "mon-fri"
    params:
      market: HK
      trade_date: "latest"
    retry:
      max_retries: 3
      delay: 300

  # 每日基本面 - 每日收盘后更新（17:30）
  daily_basic_update:
    enabled: true
    type: download
    dataset: daily_basic
    schedule:
      type: cron
      hour: 17
      minute: 30
      day_of_week: "mon-fri"
    params:
      market: CN
      trade_date: "latest"
    depends_on: [daily_update]
    retry:
      max_retries: 3
      delay: 300

  # 复权因子 - 每日更新（17:15）
  adj_factor_update:
    enabled: true
    type: download
    dataset: adj_factor
    schedule:
      type: cron
      hour: 17
      minute: 15
      day_of_week: "mon-fri"
    params:
      market: CN
      trade_date: "latest"
    retry:
      max_retries: 3
      delay: 300

  # 港股复权因子 - 每日更新（17:20）
  hk_adj_factor_update:
    enabled: true
    type: download
    dataset: adj_factor
    schedule:
      type: cron
      hour: 17
      minute: 20
      day_of_week: "mon-fri"
    params:
      market: HK
      trade_date: "latest"
    # depends_on: [hk_daily_update]
    retry:
      max_retries: 3
      delay: 300

  # 股票基本信息 - 每周一更新（可捕获新上市、退市等变化）
  basic_update:
    enabled: true
    type: download
    dataset: basic
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 7
      minute: 0
    params:
      market: CN
    retry:
      max_retries: 3
      delay: 300

  # 港股股票基本信息 - 每周一更新
  hk_basic_update:
    enabled: true
    type: download
    dataset: basic
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 7
      minute: 10
    params:
      market: HK
    retry:
      max_retries: 3
      delay: 300

  # 财务数据 - 每月1号和15号更新
  financial_update:
    enabled: true
    type: download
    dataset: [fina_indicator, cashflow, balancesheet, income]
    schedule:
      type: cron
      day: "1,15"
      hour: 6
      minute: 0
    params:
      market: CN
    retry:
      max_retries: 3
      delay: 600

  # 宏观数据 - 每月15号更新
  macro_update:
    enabled: true
    type: download
    dataset: [gdp, ppi, m, pmi]
    schedule:
      type: cron
      day: 15
      hour: 8
      minute: 0
    retry:
      max_retries: 3
      delay: 600

  # 大盘指数每日指标 - 每日更新（19:30）
  # 注意：Tushare 的指数级别数据通常在收盘后 2-3 小时才完全可用
  index_daily_update:
    enabled: true
    type: download
    dataset: index_daily
    schedule:
      type: cron
      hour: 20
      minute: 20
      day_of_week: "mon-fri"
    # 注意：index_daily 接口不支持仅通过 trade_date 批量获取全部指数当日数据
    # 因此这里不配置 trade_date，交由智能增量逻辑逐指数更新
    retry:
      max_retries: 3
      delay: 600  # 10分钟后重试

  # 大盘指数每日指标 - 每日更新（20:30）
  # 注意：Tushare 的指数级别数据通常在收盘后 2-3 小时才完全可用
  index_dailybasic_update:
    enabled: true
    type: download
    dataset: index_dailybasic
    schedule:
      type: cron
      hour: 20
      minute: 30
      day_of_week: "mon-fri"
    params:
      trade_date: "latest"
    retry:
      max_retries: 3
      delay: 600  # 10分钟后重试

  # 申万行业日线 - 每日更新（19:45）
  # 注意：Tushare 的申万行业数据通常在收盘后 2-3 小时才完全可用
  sw_daily_update:
    enabled: true
    type: download
    dataset: sw_daily
    schedule:
      type: cron
      hour: 20
      minute: 45
      day_of_week: "mon-fri"
    params:
      trade_date: "latest"
    retry:
      max_retries: 3
      delay: 600  # 10分钟后重试

  # 申万行业分类 - 每月1号更新
  sw_classify_update:
    enabled: true
    type: download
    dataset: sw_industry_classify
    schedule:
      type: cron
      day: 1
      hour: 7
      minute: 0
    retry:
      max_retries: 3
      delay: 300

  # 申万行业成分股 - 每月1号更新
  sw_member_update:
    enabled: true
    type: download
    dataset: sw_industry_member
    schedule:
      type: cron
      day: 1
      hour: 7
      minute: 30
    depends_on: [sw_classify_update]
    retry:
      max_retries: 3
      delay: 300

  # 交易日历 - 每月1号更新（获取未来一年的交易日历）
  trade_cal_update:
    enabled: true
    type: download
    dataset: trade_cal
    schedule:
      type: cron
      day: 1
      hour: 6
      minute: 30
    retry:
      max_retries: 3
      delay: 300

  # 指数成分权重 - 每月1号更新（沪深300、中证500等）
  index_weight_update:
    enabled: true
    type: download
    dataset: index_weight
    schedule:
      type: cron
      day: 1
      hour: 8
      minute: 30
    retry:
      max_retries: 3
      delay: 300

  # ========== 期货数据下载任务 ==========

  # 期货合约基础信息 - 每周一更新（捕获新品种、合约挂牌/摘牌变化）
  futures_basic_update:
    enabled: true
    type: download
    dataset: basic
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 6
      minute: 40
    params:
      asset_class: future
    retry:
      max_retries: 3
      delay: 300

  # 期货主力/连续合约映射 - 每个交易日收盘后更新
  # 显式指定 trade_date，避免仅按当前活跃池增量时漏掉当日有效合约
  # 调度时间放在夜盘开启前，确保上一交易日（含前一夜盘）已完整收盘
  # futures_mapping_update:
  #   enabled: true
  #   type: download
  #   dataset: mapping
  #   schedule:
  #     type: cron
  #     hour: 23
  #     minute: 10
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     trade_date: "latest"
  #   retry:
  #     max_retries: 3
  #     delay: 600

  # 期货日线行情 - 每个交易日收盘后更新
  # futures_daily_update:
  #   enabled: true
  #   type: download
  #   dataset: daily
  #   schedule:
  #     type: cron
  #     hour: 23
  #     minute: 15
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     trade_date: "latest"
  #   retry:
  #     max_retries: 3
  #     delay: 600

  # 期货结算参数 - 每个交易日收盘后更新
  # futures_settle_update:
  #   enabled: true
  #   type: download
  #   dataset: settle
  #   schedule:
  #     type: cron
  #     hour: 23
  #     minute: 20
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     trade_date: "latest"
  #   retry:
  #     max_retries: 3
  #     delay: 600

  # 期货分钟线 - 每个交易日收盘后更新 1m 原始数据
  # 显式指定 trade_date + symbols=all，按当日有效合约池展开并避免全历史合约扫描
  # futures_minute_update:
  #   enabled: true
  #   type: download
  #   dataset: minute_1
  #   schedule:
  #     type: cron
  #     hour: 23
  #     minute: 50
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     symbols: all
  #     trade_date: "latest"
  #   retry:
  #     max_retries: 3
  #     delay: 300

  # 期货现货价格与基差 - 每个交易日收盘后更新
  # futures_spot_basis_update:
  #   enabled: true
  #   type: download
  #   dataset: spot_basis
  #   schedule:
  #     type: cron
  #     hour: 18
  #     minute: 50
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     trade_date: "latest"
  #   retry:
  #     max_retries: 3
  #     delay: 600

  # 期货注册仓单 - 每个交易日收盘后更新
  # inventory 不支持 trade_date，全市场更新时显式收敛到单日窗口，避免首次运行扫描全历史
  # futures_inventory_update:
  #   enabled: true
  #   type: download
  #   dataset: inventory
  #   schedule:
  #     type: cron
  #     hour: 19
  #     minute: 0
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     start_date: "latest"
  #     end_date: "latest"
  #   retry:
  #     max_retries: 3
  #     delay: 600

  # 期货指数日线 - 每个交易日收盘后更新
  # index_daily 不支持 trade_date，需显式指定 start/end-date 才能把任务收敛到单交易日
  # futures_index_daily_update:
  #   enabled: true
  #   type: download
  #   dataset: index_daily
  #   schedule:
  #     type: cron
  #     hour: 19
  #     minute: 10
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     start_date: "latest"
  #     end_date: "latest"
  #   retry:
  #     max_retries: 3
  #     delay: 600

  # 期限结构 - 每个交易日收盘后按最新交易日重算
  # futures_term_structure_update:
  #   enabled: true
  #   type: download
  #   dataset: term_structure
  #   schedule:
  #     type: cron
  #     hour: 19
  #     minute: 20
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     start_date: "latest"
  #     end_date: "latest"
  #   depends_on: [futures_daily_update]
  #   retry:
  #     max_retries: 2
  #     delay: 300

  # 跨期价差 - 每个交易日收盘后按最新交易日重算
  # futures_term_spread_update:
  #   enabled: true
  #   type: download
  #   dataset: term_spread
  #   schedule:
  #     type: cron
  #     hour: 19
  #     minute: 25
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     start_date: "latest"
  #     end_date: "latest"
  #   depends_on: [futures_daily_update]
  #   retry:
  #     max_retries: 2
  #     delay: 300

  # 展期收益率 - 每个交易日收盘后按最新交易日重算
  # futures_roll_yield_update:
  #   enabled: true
  #   type: download
  #   dataset: roll_yield
  #   schedule:
  #     type: cron
  #     hour: 19
  #     minute: 30
  #     day_of_week: "mon-fri"
  #   params:
  #     asset_class: future
  #     start_date: "latest"
  #     end_date: "latest"
  #   depends_on: [futures_daily_update]
  #   retry:
  #     max_retries: 2
  #     delay: 300

  # ========== 预处理任务 ==========

  # 技术指标预处理 - 每日运行（18:00）
  # 注意：使用前复权(qfq)，需要全量预处理
  technical_preprocess:
    enabled: true
    type: preprocess
    category: technical
    schedule:
      type: cron
      hour: 18
      minute: 40
      day_of_week: "mon-fri"
    params:
      all: true
      market: CN
      freq: "daily,weekly,monthly"
      adjust: qfq
    depends_on: [daily_update, adj_factor_update]
    retry:
      max_retries: 2
      delay: 600

  # 港股技术指标预处理 - 每日运行（18:50）
  hk_technical_preprocess:
    enabled: true
    type: preprocess
    category: technical
    schedule:
      type: cron
      hour: 18
      minute: 00
      day_of_week: "mon-fri"
    params:
      all: true
      market: HK
      freq: "daily,weekly,monthly"
      adjust: qfq
    depends_on: [hk_daily_update, hk_adj_factor_update]
    retry:
      max_retries: 2
      delay: 600

  # 基本面指标预处理 - 每日运行（18:30）
  # 注意：使用增量方式预处理
  fundamental_preprocess:
    enabled: true
    type: preprocess
    category: fundamental
    schedule:
      type: cron
      hour: 17
      minute: 50
      day_of_week: "mon-fri"
    params:
      all: true
      market: CN
    depends_on: [daily_basic_update]
    retry:
      max_retries: 2
      delay: 600

  # 季度基本面指标预处理 - 每日运行（19:00）
  # 注意：使用增量方式预处理，依赖财务数据更新
  quarterly_fundamental_preprocess:
    enabled: true
    type: preprocess
    category: quarterly_fundamental
    schedule:
      type: cron
      hour: 17
      minute: 45
      day_of_week: "mon-fri"
    params:
      all: true
      market: CN
    depends_on: [financial_update]
    retry:
      max_retries: 2
      delay: 600

  # 行业差异化估值预处理 - 每日运行（18:00）
  # 根据行业配置自动选择核心估值指标（银行用PB、成长股用PEG等）
  # 计算：1. 自身历史分位数  2. 行业内相对分位
  industry_valuation_preprocess:
    enabled: true
    type: preprocess
    category: industry_valuation
    schedule:
      type: cron
      hour: 18
      minute: 0
      day_of_week: "mon-fri"
    params:
      all: true
      market: CN
    depends_on: [fundamental_preprocess]
    retry:
      max_retries: 2
      delay: 600

  # 中国宏观周期预处理 - 每月运行
  # 使用 1 个月生效延迟和 2 个月确认平滑规则，输出月度主表与行业快照
  # 依赖宏观原始数据和最新申万行业成分映射
  macro_cycle_preprocess:
    enabled: true
    type: preprocess
    category: macro_cycle
    schedule:
      type: cron
      day: 15
      hour: 8
      minute: 20
    params:
      all: true
    depends_on: [macro_update, sw_member_update]
    retry:
      max_retries: 2
      delay: 600
