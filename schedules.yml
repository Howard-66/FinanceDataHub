  # 每日 20:45：通过 Mac 端执行器刷新 BasisFlow 的 Wind Excel 静态数据。
  # 该时段位于 20:15 与 21:20 两组任务之间，完整预留约 35 分钟空档。
  basisflow_wind_excel_refresh:
    enabled: true
    type: desktop_automation
    resource_group: mac_excel
    catchup_on_failure: false
    schedule:
      type: cron
      hour: 20
      minute: 45
    params:
      action: wind_excel_refresh
      workbook_path: "/Volumes/Repository/Projects/TradingNexus/BasisFlow/data/static/煤焦钢矿.xlsx"
      excel_app_path: "/Volumes/Repository/Applications/Microsoft Excel.app"
      load_wait_seconds: 90
      refresh_wait_seconds: 150
      queue_root: "${DESKTOP_AUTOMATION_QUEUE_ROOT:-data/desktop_automation}"
      timeout_seconds: 600
    retry:
      max_retries: 1
      delay: 300

  hk_technical_preprocess:
    enabled: true
    type: preprocess
    category: technical
    schedule:
      type: cron
      hour: 21
      minute: 45
      day_of_week: "mon-fri"
    params:
      all: true
      market: HK
      freq: "daily,weekly,monthly"
      adjust: qfq
    depends_on: [hk_daily_update, hk_adj_factor_update]
    retry:
      max_retries: 2
      delay: 600

  index_basic_update:
    enabled: true
    type: download
    dataset: index_basic
    schedule:
      type: cron
      hour: 21
      minute: 20
      day_of_week: "mon-fri"
    # 静态元数据：每次刷新全部 Tushare 指数市场目录。
    retry:
      max_retries: 3
      delay: 600

  index_daily_update:
    enabled: true
    type: download
    dataset: index_daily
    schedule:
      type: cron
      hour: 21
      minute: 30
      day_of_week: "mon-fri"
    # index_daily 不支持仅通过 trade_date 批量获取全部指数当日数据。
    retry:
      max_retries: 3
      delay: 600

  index_dailybasic_update:
    enabled: true
    type: download
    dataset: index_dailybasic
    schedule:
      type: cron
      hour: 21
      minute: 40
      day_of_week: "mon-fri"
    params:
      trade_date: "latest"
    retry:
      max_retries: 3
      delay: 600

  # sw_daily_update:
