# FinanceDataHub 调度配置
#
# 此文件定义自动化数据下载、聚合刷新和预处理任务。
# 同一组任务按周期和日内执行先后排列，便于检查依赖和时间间隔。

scheduler:
  timezone: "Asia/Shanghai"
  job_store: "postgresql"         # 任务状态持久化到 PostgreSQL
  max_concurrent_jobs: 3          # 最大并发任务数
  misfire_grace_time: 3600        # 错过执行的容忍时间（秒），覆盖短暂停机/容器重启

jobs:
  # ========== 周 / 双周 / 月周期维护任务 ==========

  # 每周一：期货合约基础信息 -> A 股基础信息 -> 港股基础信息
  futures_basic_update:
    enabled: true
    type: download
    dataset: basic
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 6
      minute: 40
    params:
      asset_class: future
    retry:
      max_retries: 3
      delay: 300

  basic_update:
    enabled: true
    type: download
    dataset: basic
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 6
      minute: 50
    params:
      market: CN
    retry:
      max_retries: 3
      delay: 300

  hk_basic_update:
    enabled: true
    type: download
    dataset: basic
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 7
      minute: 0
    params:
      market: HK
    retry:
      max_retries: 3
      delay: 300

  fund_basic_update:
    enabled: true
    type: download
    dataset: fund_basic
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 7
      minute: 10
    # 基金目录为非时间序列数据：同步场内 E 和场外 O 的完整列表。
    retry:
      max_retries: 3
      delay: 600

  fund_company_update:
    enabled: true
    type: download
    dataset: fund_company
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 7
      minute: 15
    retry:
      max_retries: 3
      delay: 600

  fund_manager_update:
    enabled: true
    type: download
    dataset: fund_manager
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 7
      minute: 25
    retry:
      max_retries: 3
      delay: 600

  mkt_idx_bmk_update:
    enabled: true
    type: download
    dataset: mkt_idx_bmk
    schedule:
      type: cron
      day_of_week: "mon"
      hour: 7
      minute: 20
    retry:
      max_retries: 3
      delay: 600

  fund_nav_update:
    enabled: true
    type: download
    dataset: fund_nav
    schedule:
      type: cron
      hour: 19
      minute: 0
    params:
      # fund_nav 需要基金代码或净值日；latest 由调度执行器解析为最近日期。
      trade_date: "latest"
    retry:
      max_retries: 3
      delay: 600

  # 规模与分红接口需要运行时指定基金代码或日期；保留可启用的调度模板。
  fund_share_update:
    enabled: false
    type: download
    dataset: fund_share
    schedule:
      type: cron
      hour: 19
      minute: 10
    retry:
      max_retries: 3
      delay: 600

  fund_div_update:
    enabled: false
    type: download
    dataset: fund_div
    schedule:
      type: cron
      hour: 19
      minute: 20
    retry:
      max_retries: 3
      delay: 600

  # 基金持仓按季度披露；调度系统应在运行时提供报告期（trade_date）或基金代码。
  fund_portfolio_update:
    enabled: false
    type: download
    dataset: fund_portfolio
    schedule:
      type: cron
      month: "1,4,7,10"
      day: "20"
      hour: 8
      minute: 0
    retry:
      max_retries: 3
      delay: 600

  # 每月 1 / 15 号：财务 -> 申万分类 -> 申万成分 -> 季度基本面预处理
  financial_update:
    enabled: true
    type: download
    dataset: [fina_indicator, cashflow, balancesheet, income]
    schedule:
      type: cron
      day: "1,15"
      hour: 6
      minute: 30
    params:
      market: CN
    retry:
      max_retries: 3
      delay: 600

  sw_classify_update:
    enabled: true
    type: download
    dataset: sw_industry_classify
    schedule:
      type: cron
      day: "1,15"
      hour: 7
      minute: 10
    retry:
      max_retries: 3
      delay: 300

  sw_member_update:
    enabled: true
    type: download
    dataset: sw_industry_member
    schedule:
      type: cron
      day: "1,15"
      hour: 7
      minute: 20
    depends_on: [sw_classify_update]
    retry:
      max_retries: 3
      delay: 300

  quarterly_fundamental_preprocess:
    enabled: true
    type: preprocess
    category: quarterly_fundamental
    schedule:
      type: cron
      day: "1,15"
      hour: 8
      minute: 20
    params:
      all: true
      market: CN
    depends_on: [financial_update]
    retry:
      max_retries: 2
      delay: 600

  # 每月 1 号：交易日历 -> 指数成分权重
  trade_cal_update:
    enabled: true
    type: download
    dataset: trade_cal
    schedule:
      type: cron
      day: 1
      hour: 6
      minute: 15
    retry:
      max_retries: 3
      delay: 300

  index_weight_update:
    enabled: true
    type: download
    dataset: index_weight
    schedule:
      type: cron
      day: 1
      hour: 8
      minute: 0
    retry:
      max_retries: 3
      delay: 300

  # 每月 15 号：宏观原始数据 -> 宏观周期预处理
  macro_update:
    enabled: true
    type: download
    dataset: [gdp, ppi, m, pmi]
    schedule:
      type: cron
      day: 15
      hour: 7
      minute: 40
    retry:
      max_retries: 3
      delay: 600

  macro_cycle_preprocess:
    enabled: true
    type: preprocess
    category: macro_cycle
    schedule:
      type: cron
      day: 15
      hour: 8
      minute: 0
    params:
      all: true
    depends_on: [macro_update, sw_member_update]
    retry:
      max_retries: 2
      delay: 600

  # ========== 期货夜盘后 / T+1 日盘开盘前任务（周二到周五） ==========

  # 分钟线按 T 日交易窗口（T-1 21:00 -> T 15:00）在日线完成后统一更新；
  # 凌晨夜盘片段任务保留配置但停用，避免写入不完整交易日。
  futures_minute_5m_night_update:
    enabled: false
    type: download
    dataset: minute_5
    resource_group: xtquant_helper
    catchup_on_failure: false
    schedule:
      type: cron
      hour: 3
      minute: 20
      day_of_week: "tue-fri"
    params:
      asset_class: future
      symbols: all
      start_date: "latest-1d"
      end_date: "latest"
    retry:
      max_retries: 3
      delay: 300

  futures_minute_1m_night_update:
    enabled: false
    type: download
    dataset: minute_1
    resource_group: xtquant_helper
    catchup_on_failure: false
    schedule:
      type: cron
      hour: 3
      minute: 30
      day_of_week: "tue-fri"
    params:
      asset_class: future
      symbols: all
      start_date: "latest-1d"
      end_date: "latest"
    depends_on: [futures_minute_5m_night_update]
    retry:
      max_retries: 3
      delay: 300

  futures_minute_15m_night_refresh:
    enabled: false
    type: aggregate
    dataset: futures.minute_15m
    schedule:
      type: cron
      hour: 4
      minute: 5
      day_of_week: "tue-fri"
    params:
      asset_class: future
      start_date: "latest-1d"
      end_date: "latest"
    depends_on: [futures_minute_5m_night_update]
    retry:
      max_retries: 3
      delay: 300

  futures_minute_30m_night_refresh:
    enabled: false
    type: aggregate
    dataset: futures.minute_30m
    schedule:
      type: cron
      hour: 4
      minute: 10
      day_of_week: "tue-fri"
    params:
      asset_class: future
      start_date: "latest-1d"
      end_date: "latest"
    depends_on: [futures_minute_5m_night_update]
    retry:
      max_retries: 3
      delay: 300

  futures_minute_60m_night_refresh:
    enabled: false
    type: aggregate
    dataset: futures.minute_60m
    schedule:
      type: cron
      hour: 4
      minute: 15
      day_of_week: "tue-fri"
    params:
      asset_class: future
      start_date: "latest-1d"
      end_date: "latest"
    depends_on: [futures_minute_5m_night_update]
    retry:
      max_retries: 3
      delay: 300

  # ========== 每日收盘后任务（周一到周五） ==========

  # 16:20-18:25：期货 T 日收盘链路，尽量在 21:00 夜盘开盘前完成日线和高周期分钟聚合。
