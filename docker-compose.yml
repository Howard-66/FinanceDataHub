services:
  timescaledb:
    # 1. 改回极其稳定的 pg16 版本，避免 pg17 潜在的兼容问题
    image: timescale/timescaledb:latest-pg17
    container_name: trading_nexus_postgres
    restart: always
    # Increase shared memory for parallel queries (default 64MB is too small)
    shm_size: '8gb'
    environment:
      - POSTGRES_PASSWORD=trading.nexus.data
      - POSTGRES_USER=trading_nexus
      - POSTGRES_DB=trading_nexus_db
      - TZ=Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
      # 初始化脚本从独立目录读取迁移，避免与上方目录挂载发生重叠。
      - ./sql/migrations:/app/sql/migrations:ro
    # 主线超表已有近千个分区。创建父表索引会同时锁住各分区，默认 64
    # 个事务锁不足；该参数只能在 PostgreSQL 启动时设置。
    command: ["postgres", "-c", "max_locks_per_transaction=2048"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_nexus -d trading_nexus_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading_nexus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    environment:
      - TZ=Asia/Shanghai
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduler:
    # AKShare's current Linux py-mini-racer dependency only ships an x86_64
    # native wheel. Keep the scheduler image on amd64 even on Apple Silicon.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["scheduler"]
    container_name: trading_nexus_scheduler
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
      - DATABASE_URL=postgresql://trading_nexus:trading.nexus.data@timescaledb:5432/trading_nexus_db
      - REDIS_URL=redis://redis:6379/0
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - FUTURES_MINUTE_MAX_WORKERS=${FUTURES_MINUTE_MAX_WORKERS:-1}
      # Scheduler runs inside Docker. Do not reuse a host-side XTQUANT_API_URL
      # like http://localhost:8100; set SCHEDULER_XTQUANT_API_URL when needed.
      - XTQUANT_API_URL=${SCHEDULER_XTQUANT_API_URL:-http://host.docker.internal:8100}
      - SOURCES_CONFIG_PATH=/app/sources.yml
      - FDH_SCHEDULES_PATH=/app/schedules.yml
    volumes:
      - ./schedules.yml:/app/schedules.yml:ro
      - ./sources.yml:/app/sources.yml:ro
      - ./logs:/app/logs
      - ./data:/app/data
      # macOS LaunchAgent consumes desktop requests from this host directory.
      - ${DESKTOP_AUTOMATION_QUEUE_HOST_PATH:-/Users/howard/.financedatahub/desktop_automation/queue}:/app/data/desktop_automation
    # Docker Desktop provides host.docker.internal automatically. Do not
    # override it with host-gateway on macOS/Windows; that can point the
    # scheduler at an unreachable VM gateway instead of the host.
    command: ["fdh-cli", "schedule", "start", "--config", "/app/schedules.yml"]

# Docker Compose 网络配置
networks:
  default:
    name: trading_nexus_network

